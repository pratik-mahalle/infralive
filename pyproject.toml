[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-cost-agent"
version = "1.2.0"
license = {file = "LICENSE"}
description = "An evidence-backed AWS spending and infrastructure change assistant"
requires-python = ">=3.11"
dependencies = ["boto3>=1.40,<2", "keyring>=25,<26; sys_platform == 'darwin'"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
infra = ["cfn-lint>=1.56,<2"]

[project.scripts]
aws-cost-agent = "aws_cost_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
